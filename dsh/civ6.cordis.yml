# Project overlay for both the headless and web DSH profiles.
- insert:
    - id: mcp-civ6
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: civ6
        transport: stdio
        command: !!js process.cwd() + '/.tools/bin/uv'
        args:
          - run
          - --project
          - !!js process.cwd()
          - civ-mcp
        cwd: !!js process.cwd()
        env:
          CIV_MCP_DISABLE_LUA: '1'
          CIV_MCP_DISABLE_WEB_API: '1'
          CIV_MCP_DATA_DIR: !!js process.cwd() + '/.civ6-mcp-data'
          UV_CACHE_DIR: !!js process.cwd() + '/.uv-cache'
        toolCallTimeoutMs: 720000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    # The only permitted worker route. Its empty allowlist means advisors can
    # reason over snapshots but cannot invoke any tool or create descendants.
    - id: tool-civ-advisor
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: civ_advisor
        enableRunInBackground: true
        backgroundMode: one-shot
        toolFilter:
          allow: []
        maxDepth: 1

# Remove general delegation routes that could create workers with inherited
# mutation tools. The dedicated route above is the only worker entry point.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
